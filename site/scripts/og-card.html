<!doctype html><html><head><meta charset="utf-8"><style>
  @font-face{font-family:'SG';src:local('Space Grotesk')}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#fdfdfb;color:#111417;
       font-family:'Helvetica Neue',Arial,sans-serif;
       padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:16px}
  .label{font-size:19px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#4a5058}
  h1{font-size:60px;line-height:1.12;font-weight:600;color:#1b2a4a;max-width:20ch;letter-spacing:-0.01em}
  .rule{height:2px;background:#c8841f;margin:34px 0 30px}
  .metric{display:inline-block;background:#c8841f;color:#1a1206;font-size:22px;font-weight:600;
          padding:9px 20px;border-radius:999px}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  .who{font-size:24px;color:#1b2a4a;font-weight:600}
  .who span{display:block;font-size:19px;color:#4a5058;font-weight:400;margin-top:6px}
</style></head><body>
  <div class="top">
    <svg width="46" height="46" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#1b2a4a"/>
      <path d="M13 50 L32 32 L51 14" fill="none" stroke="#fdfdfb" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="13" cy="50" r="6" fill="#fdfdfb"/><circle cx="32" cy="32" r="6" fill="#fdfdfb"/>
      <circle cx="51" cy="14" r="8.5" fill="#c8841f" stroke="#1b2a4a" stroke-width="2.5"/></svg>
    <div class="label">Backend / AI Engineer</div>
  </div>

  <div>
    <h1>I build observable AI agent pipelines you can trace end-to-end.</h1>
    <div class="rule"></div>
    <div class="metric">time to root cause &nbsp;~14 hrs → under 2 min</div>
  </div>

  <div class="bottom">
    <div class="who">Gamaliel Dashua<span>Every step back to one ID.</span></div>
    <div class="label">github.com/Gamey001</div>
  </div>
</body></html>
