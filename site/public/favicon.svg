<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="A traceable pipeline: three nodes on a path, the last one amber">
  <rect width="64" height="64" rx="12" fill="#1b2a4a"/>
  <!--
    Three nodes on a path, the terminal node amber — the trace-ID marker rule
    at favicon size. Geometry is spread along a diagonal and the amber node
    carries a navy ring, so the three nodes stay separate at 16px instead of
    smearing into one blob.
  -->
  <path d="M13 50 L32 32 L51 14" fill="none" stroke="#fdfdfb" stroke-width="4.5"
        stroke-linecap="round"/>
  <circle cx="13" cy="50" r="6" fill="#fdfdfb"/>
  <circle cx="32" cy="32" r="6" fill="#fdfdfb"/>
  <circle cx="51" cy="14" r="8.5" fill="#c8841f" stroke="#1b2a4a" stroke-width="2.5"/>
</svg>
